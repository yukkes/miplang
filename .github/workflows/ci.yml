name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: go run ./cmd/miplang compile testdata/transport.mip -o /tmp/transport.ir.json
      - run: diff -u testdata/transport.ir.json /tmp/transport.ir.json

  python-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: runtimes/python
        env:
          PYTHONPATH: .
        run: python -m unittest -v test_runtime.py

  typescript-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: runtimes/typescript
        run: npm test

  java-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: runtimes/java/pom.xml
      - working-directory: runtimes/java
        run: mvn --batch-mode --no-transfer-progress test

  go-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - working-directory: runtimes/go
        run: go test ./...

  rust-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: runtimes/rust
        run: cargo test
